name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: npm test

  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Add the Google Drive sign-in client
        run: node scripts/write-oauth-config.js
        env:
          VNS_GOOGLE_CLIENT_ID: ${{ secrets.VNS_GOOGLE_CLIENT_ID }}
          VNS_GOOGLE_CLIENT_SECRET: ${{ secrets.VNS_GOOGLE_CLIENT_SECRET }}
      - name: Refuse to release without Google Drive sign-in
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: test -f src/main/oauth-config.json || { echo "::error::Set the VNS_GOOGLE_CLIENT_ID and VNS_GOOGLE_CLIENT_SECRET repository secrets before tagging a release."; exit 1; }
      - name: Build portable exe and zip
        run: npx electron-builder --win --x64 --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: vn-shelf-windows
          path: |
            dist/*.exe
            dist/*.zip
          if-no-files-found: error
      - name: Release notes from CHANGELOG.md (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: node scripts/release-notes.js "${{ github.ref_name }}" > release-notes.md
      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.exe
            dist/*.zip
          body_path: release-notes.md
          prerelease: ${{ contains(github.ref_name, '-') || startsWith(github.ref_name, 'v0.') }}
